name: Create GMA
on:
  workflow_dispatch:
    inputs:
      version_tag:
        type: string
        description: Version tag
        default: '1.0'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Installing Premake
        run: sudo apt-get install premake4
      - name: Building Bootil
        run: |
          git clone --depth 1 https://github.com/garrynewman/bootil.git && cd bootil/projects
          premake4 gmake && cd linux/gmake && make config=release
        working-directory: ..
      - name: Building GMAD
        run: |
          git clone --depth 1 https://github.com/Facepunch/gmad.git && cd gmad
          premake4 --outdir=. --bootil_lib=../bootil/lib/linux/gmake --bootil_inc=../bootil/include gmake && make config=release
        working-directory: ..
      - name: Creating GMA
        run: |
          ../gmad/gmad_linux create -folder . -out mmm-m9k-remastered.gma
          zip -9 mmm-m9k-remastered.zip mmm-m9k-remastered.gma
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{github.event.inputs.version_tag}}
          tag_name: ${{github.event.inputs.version_tag}}
          prerelease: false
          draft: true
          files: mmm-m9k-remastered.zip
